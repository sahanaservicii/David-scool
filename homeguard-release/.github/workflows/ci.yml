name: CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: Protocol tests (offline, no device)
        run: sh tools/test.sh

      - name: Lint and debug build
        run: gradle --no-daemon lintDebug assembleDebug

      - name: Upload debug APKs
        uses: actions/upload-artifact@v4
        with:
          name: homeguard-debug-apks
          path: |
            agent/build/outputs/apk/debug/*.apk
            console/build/outputs/apk/debug/*.apk
